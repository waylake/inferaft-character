# Long-lived dependency. Run once, by hand — releases never come near it:
#   docker compose --env-file .env.production -f compose.db.yaml up -d
name: inferaft-character-db

services:
  db:
    image: postgres:17-alpine
    container_name: inferaft-character-db
    environment:
      POSTGRES_DB: character_poc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - character_pg:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5442:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d character_poc"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped

networks:
  default:
    external: true
    name: inferaft-character

volumes:
  character_pg:
