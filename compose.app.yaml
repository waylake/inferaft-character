# Application releases only. PostgreSQL lives in its own project (compose.db.yaml)
# and is never touched by a release — the same invariant the Inferaft core uses.
name: inferaft-character

services:
  web:
    image: ${IMAGE_BASE:-ghcr.io/waylake/inferaft-character}:${RELEASE_ID:?Set RELEASE_ID}
    env_file: .env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      RELEASE_ID: ${RELEASE_ID}
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:?Set DB_PASSWORD}@inferaft-character-db:5432/character_poc
    ports:
      - 127.0.0.1:${WEB_PORT:-3084}:3000
    mem_limit: 640m
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped

networks:
  default:
    external: true
    name: inferaft-character
