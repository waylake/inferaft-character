services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: character_poc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - character_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d character_poc"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  character_pg:
