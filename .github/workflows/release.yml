# Primary release path: every push to main builds the release image in CI
# (native linux/amd64, cached) and ships the deploy-side files to dev1.
# The production switch stays a deliberate act: run the Deploy workflow to cut over.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.id.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - name: Release id
        id: id
        run: echo "release=${GITHUB_SHA::7}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:${{ steps.id.outputs.release }}
          build-args: |
            RELEASE_ID=${{ steps.id.outputs.release }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  ship:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ship deploy-side files to dev1
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          for path in scripts/deploy.py compose.app.yaml compose.db.yaml scripts/provision-site.sh; do
            scp -q "$path" "doyeon@dev1.waylake.com:apps/inferaft-character/$path"
          done
          echo "RELEASE READY ${{ needs.image.outputs.release }}; switch with the Deploy workflow."
